[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-systems-eval-portfolio"
version = "0.1.0"
description = "Deterministic Test Harnesses & Agentic Trajectory Evaluation Portfolio"
readme = "README.md"
authors = [{ name = "Krish Joshi", email = "krishjoshikrishjoshi9@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
