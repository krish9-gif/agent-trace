name: Project Dynamo & AgentTrace CI/CD Evaluation Gauntlet

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  eval-gauntlet:
    name: Dynamo Benchmark & Trajectory Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Offline Verification Tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest>=8.0.0

      - name: Run Static Security & Path Containment Linter
        run: |
          python3 -c "
          import py_compile, glob
          for f in glob.glob('**/*.py', recursive=True):
              py_compile.compile(f, doraise=True)
          print('All Python modules compile with zero syntax errors.')
          "

      - name: Run Core Test Suite (22 Unit Tests)
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --tb=short

      - name: Execute Project Dynamo Evaluation Pipeline (Harbor Standard)
        env:
          PYTHONPATH: .
        run: |
          python3 scripts/dynamo_eval_pipeline.py --task-dir benchmarks/dynamo_task_01 --ctrf ctrf-report.json

      - name: Upload CTRF Test Schema Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamo-ctrf-report
          path: ctrf-report.json
          retention-days: 14
