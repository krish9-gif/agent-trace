[task]
name = "distributed-event-state-reconciliation"
version = "1.0.0"
difficulty = "hard"
category = "distributed-systems"
tags = ["distributed-systems", "event-sourcing", "state-reconciliation", "cryptographic-verification"]
timeout_seconds = 120

[environment]
base_image = "python:3.11-slim"
working_directory = "/workspace"
user = "sandbox_user"

[evaluation]
harness = "pytest"
test_command = "bash tests/test.sh"
metric = "pass@1"
ctrf_reporting = true
reward_threshold = 1.0

[anti_cheat]
oracle_pass_rate = 1.0
nop_pass_rate = 0.0
sha256_assert = true
two_tier_isolation = true
